name: Chequeo de Moodle

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no manda a Telegram ni actualiza el estado)"
        type: boolean
        default: true
  schedule:
    # 11:17 UTC = 08:17 en Argentina (UTC-3, sin horario de verano). Lunes y viernes.
    # Evita el minuto :00 a propósito: los cron en punto compiten con miles de workflows
    # agendados a la misma hora en toda la plataforma, y GitHub puede directamente
    # descartar el disparo (no solo demorarlo) en momentos de mucha carga.
    - cron: "17 11 * * 1,5"

permissions:
  contents: write

concurrency:
  group: moodle-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - run: npm ci

      - name: Correr chequeo
        env:
          MOODLE_BASE_URL: ${{ secrets.MOODLE_BASE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          MOODLE_COURSE_IDS: ${{ secrets.MOODLE_COURSE_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUE_SOON_DAYS: ${{ secrets.DUE_SOON_DAYS }}
          MOODLE_RATE_LIMIT_MS: ${{ secrets.MOODLE_RATE_LIMIT_MS }}
          FORUM_IGNORE_PATTERN: ${{ secrets.FORUM_IGNORE_PATTERN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dry-run
          else
            npm start
          fi

      - name: Commitear estado actualizado
        if: always()
        run: |
          if [ ! -f data/state.json ]; then
            echo "No existe data/state.json (no hubo corrida real todavía), nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Actualiza estado tras chequeo [skip ci]"

          # Reintenta el push si otro push (nuestro o de otra corrida concurrente) llegó
          # primero a master: rebasea sobre el remoto actualizado y reintenta.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $i/5), rebaseando sobre origin/master y reintentando..."
            git fetch origin master
            git rebase origin/master
            sleep $((RANDOM % 5 + 1))
          done
          echo "No se pudo pushear el estado actualizado tras varios intentos."
          exit 1
