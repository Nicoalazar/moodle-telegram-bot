name: Chequeo de Moodle

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no manda a Telegram ni actualiza el estado)"
        type: boolean
        default: true
  schedule:
    # 11:17 UTC = 08:17 en Argentina (UTC-3, sin horario de verano). Lunes y viernes.
    # Evita el minuto :00 a propósito: los cron en punto compiten con miles de workflows
    # agendados a la misma hora en toda la plataforma, y GitHub puede directamente
    # descartar el disparo (no solo demorarlo) en momentos de mucha carga.
    - cron: "17 11 * * 1,5"

permissions:
  contents: read

concurrency:
  group: moodle-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - run: npm ci

      # data/state.json NUNCA se commitea al repo (podría contener notas/actividad real
      # del alumno). Se persiste en la caché de Actions entre corridas: el restore agarra
      # la entrada más reciente con prefijo "moodle-state-" (la key exacta con run_id nunca
      # matchea a propósito, así siempre cae al restore-keys). El save de más abajo crea una
      # entrada nueva con key única por run — es el patrón recomendado por GitHub para
      # cachés que se actualizan en cada corrida.
      - name: Restaurar estado (caché)
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: moodle-state-${{ github.run_id }}
          restore-keys: |
            moodle-state-

      - name: Correr chequeo
        env:
          MOODLE_BASE_URL: ${{ secrets.MOODLE_BASE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          MOODLE_COURSE_IDS: ${{ secrets.MOODLE_COURSE_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUE_SOON_DAYS: ${{ secrets.DUE_SOON_DAYS }}
          MOODLE_RATE_LIMIT_MS: ${{ secrets.MOODLE_RATE_LIMIT_MS }}
          FORUM_IGNORE_PATTERN: ${{ secrets.FORUM_IGNORE_PATTERN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dry-run
          else
            npm start
          fi

      - name: Guardar estado (caché)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: moodle-state-${{ github.run_id }}
